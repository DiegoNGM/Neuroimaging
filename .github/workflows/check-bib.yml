name: Check bibliography

# Validates references.bib (generated by Zotero + Better BibTeX) on every PR
# that touches it. Rules live in scripts/check_bib.py.
on:
  pull_request:
    paths:
      - references.bib
      - scripts/check_bib.py
      - .github/workflows/check-bib.yml

permissions:
  contents: read

jobs:
  check-bib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate references.bib
        run: python scripts/check_bib.py references.bib
