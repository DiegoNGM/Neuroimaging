[project]
name = "Neuroimaging"
version = "0.1.0"
description = ""
authors = [{ name = "Raul Gomez", email = "rgomez@tec.mx" }]
requires-python = ">=3.11"
dependencies = [
    "argparse>=1.4.0",
    "matplotlib>=3.11.2",
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
]

[project.scripts]
Neuroimaging = "Neuroimaging.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
]
